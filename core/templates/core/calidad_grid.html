<div class="grid-wrapper">

    <div class="grid-scroll">

        <table class="table-grid">
            <colgroup>
                <col style="width: 120px;">
                <col style="width: 320px;">
                <col>
            </colgroup>

            <thead>
                <tr>
                    <th onclick="sortBy('codigo')"
                        class="{% if orden == 'codigo' %}sorted {{ dir }}{% endif %}">
                        Código
                        <span class="sort-icon"></span>
                    </th>

                    <th onclick="sortBy('descripcion')"
                        class="{% if orden == 'descripcion' %}sorted {{ dir }}{% endif %}">
                        Descripción
                        <span class="sort-icon"></span>
                    </th>

                    <th onclick="sortBy('notas')"
                        class="{% if orden == 'notas' %}sorted {{ dir }}{% endif %}">
                        Notas
                        <span class="sort-icon"></span>
                    </th>
                </tr>
            </thead>

            <tbody>
                {% for c in calidades %}
                <tr class="row" data-id="{{ c.id }}" onclick="selectRow(this)">
                    <td>{{ c.codigo }}</td>
                    <td>{{ c.descripcion }}</td>
                    <td>{{ c.notas }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

    <div class="paginacion">

        <button onclick="goPage(1)" {% if calidades.number == 1 %}disabled{% endif %}>⏮</button>

        <button onclick="goPage({{ calidades.number|add:'-1' }})"
            {% if not calidades.has_previous %}disabled{% endif %}>◀</button>

        {% for num in calidades.paginator.page_range %}
            {% if num >= calidades.number|add:'-2' and num <= calidades.number|add:'2' %}
                <button onclick="goPage({{ num }})"
                    {% if num == calidades.number %}class="active"{% endif %}>
                    {{ num }}
                </button>
            {% endif %}
        {% endfor %}

        <button onclick="goPage({{ calidades.number|add:'1' }})"
            {% if not calidades.has_next %}disabled{% endif %}>▶</button>

        <button onclick="goPage({{ calidades.paginator.num_pages }})"
            {% if calidades.number == calidades.paginator.num_pages %}disabled{% endif %}>⏭</button>

    </div>

</div>
